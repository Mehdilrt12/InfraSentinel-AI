x-production-environment: &production-environment
  DJANGO_DEBUG: "false"
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set for production},api
  FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set for production}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set for production}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?CSRF_TRUSTED_ORIGINS must be set for production}
  SESSION_COOKIE_SECURE: "true"
  CSRF_COOKIE_SECURE: "true"
  JWT_REFRESH_COOKIE_SECURE: "true"
  JWT_REFRESH_COOKIE_SAMESITE: Strict
  SECURE_SSL_REDIRECT: "true"
  SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-31536000}
  SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-false}
  SECURE_HSTS_PRELOAD: ${SECURE_HSTS_PRELOAD:-false}
  TRUST_X_FORWARDED_PROTO: "true"
  TRUSTED_PROXY_COUNT: "2"
  API_DOCS_PUBLIC: "false"
  PUBLIC_REGISTRATION_ENABLED: ${PUBLIC_REGISTRATION_ENABLED:-false}
  ALLOW_INSECURE_CONNECTOR_TLS: "false"
  EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?DEFAULT_FROM_EMAIL must be set for production}
  EMAIL_HOST: ${EMAIL_HOST:?EMAIL_HOST must be set for production}

x-production-logging: &production-logging
  driver: local
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILES:-5}

services:
  db:
    ports: !reset []
    logging: *production-logging

  redis:
    ports: !reset []
    logging: *production-logging

  migrate:
    environment: *production-environment
    logging: *production-logging

  api:
    environment: *production-environment
    ports: !reset []
    logging: *production-logging

  worker:
    environment: *production-environment
    logging: *production-logging

  beat:
    environment: *production-environment
    logging: *production-logging

  frontend:
    ports: !reset []
    logging: *production-logging

  proxy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN must be set for production}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set for production}
    extra_hosts:
      - "${APP_DOMAIN:?APP_DOMAIN must be set for production}:127.0.0.1"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTPS_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
      - "${HTTPS_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443/udp"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget --no-check-certificate --quiet --output-document=-
          https://$$APP_DOMAIN/api/health/
          | grep -q '"status":"ok"'
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 30s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:size=32m,mode=1777
    restart: unless-stopped
    networks:
      - edge
    depends_on:
      frontend:
        condition: service_healthy
    stop_grace_period: 30s
    pids_limit: 256
    logging: *production-logging

volumes:
  caddy_data:
  caddy_config:
